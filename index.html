<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --error: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 1.35rem;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #475569;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status.show {
      display: block;
    }

    .status.info {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #7dd3fc;
    }

    .status.success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .data-box {
      margin-top: 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      max-height: 260px;
      overflow-y: auto;
      font-size: 0.85rem;
      display: none;
    }

    .data-box.show {
      display: block;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Data Manager</h1>
    <p class="subtitle">Google Apps Script backend connection</p>

    <form id="dataForm">
      <div class="form-group">
        <label for="title">Title / Name</label>
        <input type="text" id="title" name="title" placeholder="Enter title..." required />
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="General">General</option>
          <option value="Book">Book</option>
          <option value="Order">Order</option>
          <option value="Note">Note</option>
        </select>
      </div>

      <div class="form-group">
        <label for="details">Details</label>
        <textarea id="details" name="details" placeholder="Enter details..."></textarea>
      </div>

      <div class="btn-row">
        <button type="submit" id="submitBtn" class="btn-primary">Save Data</button>
        <button type="button" id="loadBtn" class="btn-secondary">Load Data</button>
      </div>
    </form>

    <div id="statusBox" class="status"></div>

    <div id="dataBox" class="data-box">
      <pre id="outputPre"></pre>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzs-clikQyomH99kmSu6Nt1J4SVORuhwqYN3jI6EweR1frqR0RHtNbvEUKFzNOQDkc/exec";

    const form = document.getElementById("dataForm");
    const submitBtn = document.getElementById("submitBtn");
    const loadBtn = document.getElementById("loadBtn");
    const statusBox = document.getElementById("statusBox");
    const dataBox = document.getElementById("dataBox");
    const outputPre = document.getElementById("outputPre");

    function setStatus(message, type = "info") {
      statusBox.textContent = message;
      statusBox.className = `status show ${type}`;
    }

    function clearStatus() {
      statusBox.className = "status";
      statusBox.textContent = "";
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      loadBtn.disabled = isLoading;
    }

    async function parseResponse(response) {
      const text = await response.text();
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${text || response.statusText}`);
      }
      try {
        return JSON.parse(text);
      } catch {
        return { raw: text };
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearStatus();

      const payload = {
        action: "create",
        title: document.getElementById("title").value.trim(),
        category: document.getElementById("category").value,
        details: document.getElementById("details").value.trim(),
        timestamp: new Date().toISOString()
      };

      if (!payload.title) {
        setStatus("Title එක හිස්ව තබන්න බැහැ.", "error");
        return;
      }

      setLoading(true);
      setStatus("Data save කරමින් පවතී...", "info");

      try {
        // text/plain භාවිත කිරීමෙන් Apps Script POST requests වලදී preflight/CORS ගැටලු අවම වේ
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const result = await parseResponse(response);

        if (result && result.success === false) {
          throw new Error(result.message || result.error || "Save failed");
        }

        setStatus("සාර්ථකව save වුණා!", "success");
        form.reset();
      } catch (err) {
        setStatus(`Error: ${err.message}`, "error");
      } finally {
        setLoading(false);
      }
    });

    loadBtn.addEventListener("click", async () => {
      clearStatus();
      setLoading(true);
      setStatus("Data load කරමින් පවතී...", "info");

      try {
        const url = `${SCRIPT_URL}?action=read&_t=${Date.now()}`;
        const response = await fetch(url, {
          method: "GET"
        });

        const result = await parseResponse(response);

        if (result && result.success === false) {
          throw new Error(result.message || result.error || "Failed to load data");
        }

        outputPre.textContent = JSON.stringify(result, null, 2);
        dataBox.classList.add("show");
        setStatus("Data සාර්ථකව load වුණා.", "success");
      } catch (err) {
        setStatus(`Load Error: ${err.message}`, "error");
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
